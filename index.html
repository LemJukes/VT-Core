<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbatempus</title>
    <meta name="description" content="Verbatempus turns a JavaScript Date into an English phrase you can read or say aloud, at four levels of verbosity.">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <div class="header">
        <h1>Verbatempus - A Clock full of Words</h1>
        <div id="utcClock" class="clock">00:00:00.000</div>
        <nav class="site-nav" aria-label="Site">
            <a href="./" class="nav-link" aria-current="page">Home</a>
            <a href="usage.html" class="nav-link">Usage</a>
            <a href="https://www.npmjs.com/package/verbatempus" class="nav-link">npm</a>
            <a href="https://github.com/LemJukes/VT-Core" class="nav-link">GitHub</a>
        </nav>
    </div>

    <div class="content">
        <div class="display"><span class="level">verbose</span><span id="verboseDisplay"></span></div>
        <div class="display"><span class="level">lengthy</span><span id="lengthyDisplay"></span></div>
        <div class="display"><span class="level">short</span><span id="shortDisplay"></span></div>
        <div class="display"><span class="level">terse</span><span id="terseDisplay"></span></div>
    </div>

    <div class="navigation">
        <h2>Displays</h2>
        <a href="https://terminal.verbatempus.com" class="nav-link">Terminal</a>
        <a href="https://lemjukes.github.io/VT-split-flap/" class="nav-link">Split-Flap</a>
        <a href="https://lemjukes.github.io/VT-flipdot/" class="nav-link">Flip-Dot</a>
    </div>

    <div class="footer">
        <p>by Juke LTD.</p>
    </div>

    <script type="module">
        import { format } from './src/index.js';

        const LEVELS = ['verbose', 'lengthy', 'short', 'terse'];

        function updateDisplays() {
            const now = new Date();
            for (const level of LEVELS) {
                document.getElementById(level + 'Display').textContent = format(now, { level, parts: 'both' });
            }
        }

        function updateClock() {
            const now = new Date();
            const isoString = now.toISOString();
            const dateStr = isoString.split('T')[0];
            const timeStr = isoString.split('T')[1].slice(0, 8);
            document.getElementById('utcClock').textContent = `${dateStr} ${timeStr}`;
            requestAnimationFrame(updateClock);
        }

        // Initialize Displays and Clock
        updateClock();
        updateDisplays();

        // Update Displays every second
        setInterval(updateDisplays, 1000);
    </script>
</body>
</html>
